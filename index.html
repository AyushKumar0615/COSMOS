<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>COSMOS — Explore the Universe</title>
    <meta
      name="description"
      content="Explore the solar system, discover distant galaxies, travel through nebulae and experience the universe in an immersive interactive 3D environment."
    />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="author" content="COSMOS" />
    <meta name="robots" content="index, follow" />

    <!-- Matches the deep-space background, so the browser chrome does not
         flash white before the page paints. -->
    <meta name="theme-color" content="#03040B" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/cosmos.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="COSMOS" />
    <meta property="og:title" content="COSMOS — Explore the Universe" />
    <meta
      property="og:description"
      content="Explore the solar system, discover distant galaxies, travel through nebulae and experience the universe in an immersive interactive 3D environment."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The COSMOS title, Explore the Universe, over a deep-space starfield." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="COSMOS — Explore the Universe" />
    <meta
      name="twitter:description"
      content="Explore the solar system, discover distant galaxies, travel through nebulae and experience the universe in an immersive interactive 3D environment."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="The COSMOS title, Explore the Universe, over a deep-space starfield." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      COSMOS is an interactive 3D experience and requires JavaScript to run.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
